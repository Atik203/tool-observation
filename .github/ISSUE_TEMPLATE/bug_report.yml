name: Bug report
description: Report a reproducible defect in code, configuration, or documentation.
title: "[bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, PII, or raw τ-bench trajectories in this issue.
        Report security issues privately per SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the defect.
      placeholder: "Running `python -m toolobs.cli validate` exits 1 because ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal commands or a small code snippet. Do not attach data.
      placeholder: |
        1. conda activate tool-observation
        2. python -m toolobs.cli validate
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `python -m toolobs.cli --version` or the git commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether a GPU is involved.
      placeholder: "Windows 11, Python 3.12, CPU only"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste only non-sensitive traceback or log lines.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I have removed secrets, PII, and raw data from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
