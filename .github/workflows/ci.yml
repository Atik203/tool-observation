name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (no dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps

      - name: Install pytest
        run: pip install pytest

      - name: Byte-compile source
        run: python -m compileall -q src

      - name: Run smoke tests
        run: python -m pytest -q
