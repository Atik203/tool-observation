[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-observation"
version = "0.1.0"
description = "Fixed-prefix causal study of tool-result errors in language-model agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Atikur Rahaman", email = "atikurrahaman0305@gmail.com" },
]
keywords = [
  "llm-agents",
  "causal-inference",
  "tool-use",
  "tau-bench",
  "evaluation",
  "research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "pyarrow",
  "pyyaml",
  "jinja2",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
toolobs = "toolobs.cli:main"

[project.urls]
Homepage = "https://github.com/Atik203/tool-observation"
Repository = "https://github.com/Atik203/tool-observation"
Issues = "https://github.com/Atik203/tool-observation/issues"
Changelog = "https://github.com/Atik203/tool-observation/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
